[project]
name = "ozon-telegram-analyst"
version = "0.1.0"
description = "Telegram analyst for Ozon sellers with Polars, SQLite and Claude"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiogram>=3.20,<4",
  "aiosqlite>=0.21,<1",
  "filelock>=3.18,<4",
  "httpx>=0.28,<1",
  "polars>=1.30,<2",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[project.scripts]
ozon-bot = "ozon_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/ozon_bot"]
